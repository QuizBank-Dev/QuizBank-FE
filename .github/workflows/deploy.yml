name: Deploy to deploy-repo

on:
    push:
        branches:
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set Git user
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Clone deploy repository
              run: |
                  git clone https://x-access-token:${{ secrets.DEPLOY_REPO_PAT }}@github.com/Kim-HyounSuk/quizbank-prod.git deploy

            - name: Sync files
              run: |
                  rsync -av --delete --exclude=".git" ./ deploy/
                  cd deploy
                  git checkout develop
                  git add .
                  git commit -m "🚀 Auto deploy from dev-repo $GITHUB_SHA" || echo "No changes to commit"
                  git push origin develop
