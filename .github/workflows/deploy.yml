name: Deploy to deploy-repo

on:
    push:
        branches:
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: develop

            - name: Set Git user
              run: |
                  git config --global user.name "GitHub Actions"
                  git config --global user.email "actions@github.com"

            - name: Clone deploy repository & checkout branch
              run: |
                  git clone https://x-access-token:${{ secrets.DEPLOY_REPO_PAT }}@github.com/Kim-HyounSuk/quizbank-prod.git deploy
                  cd deploy
                  git checkout develop

            - name: Sync files
              run: |
                  rsync -av --delete \
                    --exclude=".git" \
                    --exclude=".github/workflows" \
                    ./ ./deploy/
                  cd deploy
                  git add .
                  git commit -m "🚀 Auto deploy from dev-repo $GITHUB_SHA" || echo "No changes to commit"
                  git push origin develop
